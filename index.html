    this.lastAdd = now;
    this.setState({ count: this.state.count + (n || 40) });
  };

    const r = this.sentinel.getBoundingClientRect();
    const vh = window.innerHeight || 800;
    if (r.top < vh * 2.2) this.add(40);

    s.appendChild(c);

  }

}

uniform vec2 size;

uniform vec3 pointer;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.11, 311.73))) * 4375.39);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
    mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}

float turbulence(vec2 p) {
  float total = 0.0;
  float strength = .52;
  for (int i = 0; i < 4; i++) {
    total += noise(p) * strength;
    p = mat2(.84, .55, -.55, .84) * p * 2.06 + vec2(.17, 2.5);
    strength *= .51;
  }
  return total;
}

vec3 bloom(vec3 dest, vec3 dye, vec2 pos, vec2 center, float radius, float seed, float gain) {
  vec2 q = (pos - center) / radius;
  vec2 skew = q + vec2(q.y * .21, 0);
  if (dot(skew, skew) > 2.45) return dest;
  float drift = turbulence(skew * 2.95 + seed);
  float pulp = turbulence(skew * 8.15 + drift * 2.4 + seed * .17);
  float front = length(skew * vec2(.96, 1.095)) + (drift - .53) * .80;
  float stain = 1.0 - smoothstep(.76, 1.04, front + (pulp - .46) * .30);
  float tide = (smoothstep(.62, .81, front) - smoothstep(.87, 1.06, front)) * stain;
  vec3 pigment = dye * (.35 + .57 * drift + .43 * pulp) + dye * tide * .31;
  return mix(dest, pigment, stain * gain * (.56 + .40 * pulp));
}

void main() {
  vec2 uv = gl_FragCoord.xy / size;
  float aspect = size.x / max(1.0, size.y);
  vec2 world = vec2(uv.x * aspect, uv.y);
  float open = smoothstep(0.0, 1.0, motion.x);
  float ride = motion.y;
  float quiet = motion.z;
  float phase = ride * .59 + (1.0 - quiet) * (open * 1.23 + sin(motion.w * .62) * .29);
  float spread = mix(.61 + open * .39, .96, quiet);
  float breathe = mix(.73, .99, open);
  float side = smoothstep(.13, .92, uv.x);
  vec3 base = mix(vec3(.067, .071, .089), vec3(.101, .085, .105), uv.y);
  vec3 shade = base;

  vec2 copper = vec2(aspect * (.86 - sin(phase) * .045), .88 - .14 * sin(phase * .80));
  vec2 rose = vec2(aspect * (.77 + .09 * cos(phase)), .16 + .27 * sin(phase * .75));
  vec2 indigo = vec2(aspect * (.16 + .15 * sin(phase + .9)), .15 + .21 * cos(phase * .55));
  vec2 blue = vec2(aspect * (.56 + .09 * cos(phase * 1.2)), .68 + .17 * sin(phase * 1.1));
  shade = bloom(shade, vec3(.09, .135, .70), world, indigo, .60 * spread, 18.0, .62 * breathe);
  shade = bloom(shade, vec3(.16, .24, .84), world, blue, .38 * spread, 3.4, .30 * breathe);
  shade = bloom(shade, vec3(.69, .12, .32), world, rose, .47 * spread, 29.0, (.37 + side * .43) * breathe);
  shade = bloom(shade, vec3(.97, .45, .075), world, copper, .53 * spread, 4.7, (.42 + side * .46) * breathe);
  if (pointer.z > .005) {
    vec2 pen = vec2(pointer.x * aspect, pointer.y);
    shade = bloom(shade, vec3(.86, .34, .21), world, pen, .20, 41.0, pointer.z * .62);
  }

  float grain = (hash(mod(floor(gl_FragCoord.xy), 89.0)) - .5) * .039;
  vec3 ink = mix(base, shade, .40 + side * .60);
  gl_FragColor = vec4(ink + grain, 1.0);
}
`;
(() => {
  const canvas = document.getElementById('light-flow');
  const backdrop = canvas.parentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const origin = performance.now();
  const context = canvas.getContext('webgl', { antialias: false, alpha: false });
  const scene = context && makeScene(context);
  let frame = 0;
  let previous = origin;
  let painted = 0;
  let targetScroll = window.scrollY;
  let scroll = targetScroll;
  let targetX = .72;
  let targetY = .58;
  let targetInk = 0;
  let x = targetX;
  let y = targetY;
  let ink = targetInk;

  function schedule() {
    if (!frame && !document.hidden) frame = requestAnimationFrame(render);
  }

  function render(now) {
    frame = 0;
    if (now - painted < 31) { schedule(); return; }
    painted = now;
    const quiet = reduced.matches;
    const elapsed = (now - origin) / 1000;
    const duration = quiet ? 1.55 : 4.6;
    const reveal = Math.min(1, elapsed / duration);
    const dt = Math.min(50, Math.max(0, now - previous));
    previous = now;
    const ease = 1 - Math.exp(-dt / 108);
    scroll = approach(scroll, targetScroll, ease, .35);
    x = approach(x, targetX, ease, .001);
    y = approach(y, targetY, ease, .001);
    ink = quiet ? 0 : approach(ink, targetInk, ease, .003);
    const distance = scroll / Math.max(window.innerHeight, 1);
    backdrop.style.setProperty('--warmth', (.32 + .24 * reveal + Math.sin(distance) * .10).toFixed(3));
    if (scene) {
      scene.paint(canvas.width, canvas.height, reveal, quiet ? 0 : distance, x, y, ink, quiet, elapsed);
    }
    if (!quiet || reveal < 1 || scroll !== targetScroll || ink !== (quiet ? 0 : targetInk) || x !== targetX || y !== targetY) schedule();
  }

  function approach(value, target, ease, precision) {
    return Math.abs(target - value) <= precision ? target : value + (target - value) * ease;
  }

  function resize() {
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (!width || !height) return;
    const scale = Math.min(.62, 840 / width, 580 / height);
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    schedule();
  }

  window.addEventListener('scroll', () => {
    targetScroll = window.scrollY;
    schedule();
  }, { passive: true });
  window.addEventListener('pointermove', event => {
    if (event.pointerType === 'touch' || reduced.matches) return;
    targetX = event.clientX / Math.max(1, window.innerWidth);
    targetY = 1 - event.clientY / Math.max(1, window.innerHeight);
    targetInk = 1;
    schedule();
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => {
    targetInk = 0;
    schedule();
  });
  document.addEventListener('visibilitychange', schedule);
  reduced.addEventListener('change', schedule);
  new ResizeObserver(resize).observe(canvas);
  resize();

  function makeScene(gl) {
    const vertex = compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }');
    const fragment = compile(gl.FRAGMENT_SHADER, FRAGMENT);
    if (!vertex || !fragment) return null;
    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return null;
    gl.useProgram(program);
    gl.deleteShader(vertex);
    gl.deleteShader(fragment);
    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const location = gl.getAttribLocation(program, 'p');
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, 2, gl.FLOAT, false, 0, 0);
    const size = gl.getUniformLocation(program, 'size');
    const motion = gl.getUniformLocation(program, 'motion');
    const pointer = gl.getUniformLocation(program, 'pointer');
    canvas.dataset.ready = 'true';
    canvas.addEventListener('webglcontextlost', () => { delete canvas.dataset.ready; });
    return {
      paint(width, height, reveal, travel, x, y, ink, quiet, elapsed) {
        if (gl.isContextLost()) return;
        gl.viewport(0, 0, width, height);
        gl.uniform2f(size, width, height);
        gl.uniform4f(motion, reveal, travel, quiet ? 1 : 0, elapsed % (Math.PI * 2 / .62));
        gl.uniform3f(pointer, x, y, ink);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
    };

    function compile(kind, source) {
      const shader = gl.createShader(kind);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return gl.getShaderParameter(shader, gl.COMPILE_STATUS) ? shader : null;
    }
  }
})();
</script>
</body>
