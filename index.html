        const t = arr[k]; arr[k] = arr[j]; arr[j] = t;
      }
      this[key] = arr;
    }
    return this[key].pop();

      const form = pick[1] === 'f' ? a[1] : pick[1] === 'p' ? a[2] : a[0];
      return form + ' ' + pick[0];

  }

      const i = this.words.length;
      const r = this.rand();
      const c = this.cls[(i * 5 + Math.floor(r * 4)) % this.cls.length];
      this.words.push({ text: this.nextWord(i), cls: 'it ' + c });
    }
  }

    const now = Date.now();
    if (now - this.lastAdd < 120) return;
    this.lastAdd = now;
    this.setState({ count: this.state.count + (n || 40) });
  };

  more = () => { this.add(60); };

  check = () => {
    if (!this.sentinel) return;
    const r = this.sentinel.getBoundingClientRect();
    const vh = window.innerHeight || 800;
    if (r.top < vh * 2.2) this.add(40);
  };

const stream = document.getElementById('stream');

let shown = 0;
function paint() {
  const v = comp.renderVals();
  const frag = document.createDocumentFragment();
  for (; shown < v.words.length; shown++) {
    const w = v.words[shown];
    const s = document.createElement('span');
    s.className = w.cls;
    s.textContent = w.text;
    const c = document.createElement('span');
    c.className = 'cm';
    c.textContent = ',';
    s.appendChild(c);
    frag.appendChild(s);
  }
  stream.insertBefore(frag, dots);

}

more.hidden = false;

paint();
