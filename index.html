<!doctype html>
<html lang="ru">

<title>Влад, с днём рождения!</title>
<meta name="description" content="Поздравление для крёстного и бесконечная лента пожеланий.">
<meta property="og:title" content="Влад, с днём рождения!">

<meta name="theme-color" content="#f2eadb">

    background: #e4ead8;
    box-shadow: 5px 5px 0 #283f311d;

    min-height: 44px;
    padding: 8px 13px;
    border: 1px solid currentColor;
    border-radius: 0;
    color: var(--green);
    background: transparent;
    font: 700 .9rem/1.2 var(--sans);
    cursor: pointer;
  }
  button:hover { color: var(--paper); background: var(--green); border-color: var(--green); }
  #draw { margin-top: 15px; }
  main { padding-block: clamp(26px, 4vw, 50px) 85px; border-top: 1px solid var(--rule); }
  main h2 { margin-bottom: 24px; font: 600 italic clamp(1.6rem, 3.4vw, 2.75rem)/1.18 var(--serif); color: var(--green); }

  .cm { color: var(--muted); }
  .wa, .wf { font-family: var(--serif); font-style: italic; font-weight: 600; }
  .wb { color: var(--red); font-size: .87em; font-weight: 900; }
  .wc { color: var(--muted); font-size: .84em; }
  .wd { color: var(--green); font-family: var(--serif); font-size: 1.17em; font-weight: 700; }
  .we { font-size: .93em; font-weight: 700; }

  <p class="mast">Крёстному</p>
  <div class="cover">
    <div>
      <h1>Влад,<em>с днём рождения!</em></h1>

      <button id="draw" type="button">Вытянуть пожелание</button>
    </aside>
  </div>
</header>
<main class="frame">
  <h2>И ещё желаю тебе…</h2>

        if (key === 'nDeck') arr = arr.filter((p) => this.base.indexOf(p[0]) === -1);

      for (let k = arr.length - 1; k > 0; k--) {

      this[key] = arr;

      const form = pick[1] === 'f' ? a[1] : pick[1] === 'p' ? a[2] : a[0];

      const r = this.rand();

      this.words.push({ text: this.nextWord(i), cls: 'it ' + c });
    }

    this.lastAdd = now;
    this.setState({ count: this.state.count + (n || 40) });
  };

  more = () => { this.add(60); };

  check = () => {
    if (!this.sentinel) return;
    const r = this.sentinel.getBoundingClientRect();
    const vh = window.innerHeight || 800;
    if (r.top < vh * 2.2) this.add(40);
  };

const comp = new Component();
const stream = document.getElementById('stream');
const dots = document.getElementById('dots');

let shown = 0;
function paint() {
  const v = comp.renderVals();
  const frag = document.createDocumentFragment();
  for (; shown < v.words.length; shown++) {
    const w = v.words[shown];
    const s = document.createElement('span');
    s.className = w.cls;
    s.textContent = w.text;
    const c = document.createElement('span');
    c.className = 'cm';
    c.textContent = ',';
    s.appendChild(c);
    frag.appendChild(s);
  }
  stream.insertBefore(frag, dots);

}
comp.setSentinel(document.getElementById('sentinel'));
const more = document.getElementById('more');
more.addEventListener('click', () => comp.more());

  drawn.textContent = luckyWishes[luckyIndex];
  luckyIndex = (luckyIndex + 1) % luckyWishes.length;
  draw.textContent = 'Вытянуть ещё';
});
paint();
comp.componentDidMount();

</script>
